apiVersion: apps/v1
kind: Deployment
metadata:
  name: dict-service
  labels:
    app: dict-service
spec:
  replicas: 2  # 2 копии
  selector:
    matchLabels:
      app: dict-service
  template:
    metadata:
      labels:
        app: dict-service
    spec:
      containers:
      - name: dict-service
        image: dict-service:latest  
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dict-service
spec:
  selector:
    app: dict-service
  ports:
  - port: 80
    targetPort: 8001
  type: ClusterIP  # Внутренний сервис